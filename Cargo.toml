[package]
name = "wonderland-template-plugin"
description = "Starter plugin for the Wonderland dynamic plugin host."
authors = ["Yuef Chen"]
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
wonderland-plugin-sdk = { version = "0.1.8", path = "../../crates/plugin-sdk" }

[workspace]
resolver = "3"
members = [
    "."
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde_json = "1"
